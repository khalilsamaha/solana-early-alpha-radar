name: Offline ML regression checks
on:
  push:
    paths:
      - 'research-ml/**'
      - 'forward-study/**'
      - 'availability-study/**'
      - 'research-dataset/**'
      - 'qualification-review/**'
      - 'launch-study/**'
      - '.github/workflows/research-ml.yml'
  pull_request:
    paths:
      - 'research-ml/**'
      - 'forward-study/**'
      - 'availability-study/**'
      - 'research-dataset/**'
      - 'qualification-review/**'
      - 'launch-study/**'
      - '.github/workflows/research-ml.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-ml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install isolated research dependencies
        run: |
          python3 -m venv /tmp/radar-ml-venv
          /tmp/radar-ml-venv/bin/python -m pip install -r research-ml/requirements.txt
      - name: Offline benchmark regression tests
        run: |
          /tmp/radar-ml-venv/bin/python -m unittest discover -s research-ml -p 'test_*.py'
          /tmp/radar-ml-venv/bin/python -m unittest discover -s forward-study -p 'test_model.py'
          /tmp/radar-ml-venv/bin/python -m unittest discover -s forward-study -p 'test_experiment.py'
          /tmp/radar-ml-venv/bin/python -m unittest discover -s forward-study -p 'test_failure_audit.py'
          /tmp/radar-ml-venv/bin/python -m unittest discover -s availability-study -p 'test_*.py'

name: Source and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # Full successor regressions exceed ten minutes on slower hosted runners.
    # These are job budgets only; no application or test deadline is changed.
    timeout-minutes: ${{ matrix.group == 'position-book-1' && 20 || startsWith(matrix.group, 'position-book-') && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        group: [core-base, position-book-0, position-book-1, position-book-2, position-book-3, position-book-4, position-book-5, position-book-6, position-book-7, position-book-8, position-book-9, devnet-pool]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified at import
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified at import
        with:
          node-version: '24.19.0'
      - name: Runtime versions
        run: |
          node --version
          python3 --version
      - name: Source integrity and offline regression tests
        run: bash scripts/check.sh '${{ matrix.group }}'

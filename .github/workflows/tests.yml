name: Source and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks (${{ matrix.pair.name }})
    runs-on: ubuntu-24.04
    # Two isolated existing partitions are run sequentially per runner.
    # Baseline individual partitions could approach the former 10-minute cap.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        pair:
          - {name: core-and-book-1, first: core-base, second: position-book-1}
          - {name: book-2-and-7, first: position-book-2, second: position-book-7}
          - {name: book-0-and-8, first: position-book-0, second: position-book-8}
          - {name: book-3-and-9, first: position-book-3, second: position-book-9}
          - {name: book-4-and-6, first: position-book-4, second: position-book-6}
          - {name: book-5-and-devnet, first: position-book-5, second: devnet-pool}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified at import
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified at import
        with:
          node-version: '24.19.0'
      - name: Runtime versions
        run: |
          node --version
          python3 --version
      - name: First independent regression partition (${{ matrix.pair.first }})
        run: bash scripts/check.sh '${{ matrix.pair.first }}'
      - name: Second independent regression partition (${{ matrix.pair.second }})
        # Run even when the first partition fails; both independent partitions
        # report their results, while an unsuccessful pair still fails the job.
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh '${{ matrix.pair.second }}'
